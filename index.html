  player.x = L.playerStart.x;
  player.y = L.playerStart.y;
  player.vx = 0; player.vy = 0;
  player.onGround = false;
  player.facing = 1;
  player.invincible = 0;

  platforms = L.platforms.map(p => ({ ...p }));
  movingPlatforms = L.movingPlatforms.map(p => ({
    ...p,
    x: p.startX,
    dir: 1,
    startX: p.startX, endX: p.endX
  }));
  coins = L.coins.map(c => ({ x: c.x, y: c.y, collected: false }));
  spikes = L.spikes.map(s => ({ x: s.x, y: s.y, w: s.w, h: 15 }));
  enemies = L.enemies.map(e => ({
    x: e.startX, y: e.y, w: 30, h: 30,
    startX: e.startX, endX: e.endX,
    speed: e.speed, dir: 1
  }));
  flag = { x: L.flag.x, y: L.flag.y, w: 40, h: 100 };

  coinsCollected = 0;
  state = 'playing';
  updateUI();
  hideMessage();
}

// ===== Обновление UI =====
function updateUI() {
  coinsUI.textContent = `🪙 ${coinsCollected} / ${coins.length}`;
  livesUI.textContent = '❤️ '.repeat(Math.max(0, lives)).trim() || '—';
  levelInfo.textContent = `Уровень ${currentLevel + 1} / ${levels.length}`;
}

// ===== Показать сообщение с кнопками =====
function showMessage(text, buttons) {
  messageText.textContent = text;
  messageButtons.innerHTML = '';
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'modal-btn ' + b.cls;
    btn.textContent = b.label;
    btn.addEventListener('click', b.action);
    messageButtons.appendChild(btn);
  });
  messageEl.classList.remove('hidden');
}

function hideMessage() {
  messageEl.classList.add('hidden');
}

// ===== Рестарт текущего уровня =====
function restartLevel() {
  lives = MAX_LIVES;
  loadLevel(currentLevel);
}

// ===== Следующий уровень =====
function nextLevel() {
  currentLevel++;
  if (currentLevel >= levels.length) {
    // Все уровни пройдены — возвращаемся в начало
    currentLevel = 0;
    lives = MAX_LIVES;
  }
  loadLevel(currentLevel);
}

// ===== Полный сброс =====
function fullReset() {
  currentLevel = 0;
  lives = MAX_LIVES;
  loadLevel(0);
}

// ===== Коллизии =====
function rectRect(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}
function circleRect(circle, rect) {
  const r = circle.r || 12;
  const closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
  const closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
  const dx = circle.x - closestX;
  const dy = circle.y - closestY;
  return dx * dx + dy * dy < r * r;
}

// ===== Урон игроку =====
function hurtPlayer() {
  if (player.invincible > 0) return;
  lives--;
  updateUI();
  if (lives <= 0) {
    state = 'lost';
    showMessage('Упс! Попробуй снова', [
      { label: '🔄 Заново уровень', cls: 'btn-restart', action: restartLevel },
      { label: '🏁 С самого начала', cls: 'btn-reset', action: fullReset }
    ]);
  } else {
    player.invincible = 2;
    player.vy = -400;
  }
}

// ===== Обновление логики =====
function update(dt) {
  if (state !== 'playing') return;

  if (player.invincible > 0) player.invincible -= dt;

  player.vx = 0;
  if (input.left)  { player.vx = -MOVE_SPEED; player.facing = -1; }
  if (input.right) { player.vx =  MOVE_SPEED; player.facing =  1; }

  if (jumpRequested && player.onGround) {
    player.vy = -JUMP_SPEED;
    player.onGround = false;
  }
  jumpRequested = false;

  player.vy += GRAVITY * dt;
  if (player.vy > 1000) player.vy = 1000;

  // Движущиеся платформы
  for (const p of movingPlatforms) {
    p.x += p.speed * p.dir * dt;
    if (p.x <= p.startX) { p.x = p.startX; p.dir = 1; }
    if (p.x >= p.endX) { p.x = p.endX; p.dir = -1; }
  }

  // Враги
  for (const e of enemies) {
    e.x += e.speed * e.dir * dt;
    if (e.x <= e.startX) { e.x = e.startX; e.dir = 1; }
    if (e.x >= e.endX) { e.x = e.endX; e.dir = -1; }
  }

  // Движение по X
  player.x += player.vx * dt;
  const allPlatforms = [...platforms, ...movingPlatforms];
  for (const p of allPlatforms) {
    if (rectRect(player, p)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }

  if (player.x < 0) player.x = 0;
  if (player.x + player.w > worldWidth) player.x = worldWidth - player.w;

  // Движение по Y
  player.y += player.vy * dt;
  player.onGround = false;
  for (const p of allPlatforms) {
    if (rectRect(player, p)) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  }

  // Шипы
  for (const spike of spikes) {
    if (rectRect(player, spike)) hurtPlayer();
  }

  // Враги
  for (const e of enemies) {
    if (rectRect(player, e)) {
      if (player.vy > 0 && player.y + player.h - e.y < 20) {
        player.vy = -500;
        e.x = -10000; // убираем врага
      } else {
        hurtPlayer();
      }
    }
  }

  // Падение
  if (player.y > WORLD_HEIGHT + 100) {
    hurtPlayer();
    if (state === 'playing') {
      player.x = levels[currentLevel].playerStart.x;
      player.y = levels[currentLevel].playerStart.y;
      player.vx = 0; player.vy = 0;
    }
  }

  // Монеты
  for (const coin of coins) {
    if (!coin.collected && circleRect(coin, player)) {
      coin.collected = true;
      coinsCollected++;
      updateUI();
    }
  }

  // Финиш
  if (coinsCollected === coins.length && rectRect(player, flag)) {
    state = 'won';
    // Восстанавливаем 1 жизнь при победе
    if (lives < MAX_LIVES) lives++;
    updateUI();
    if (currentLevel === levels.length - 1) {
      showMessage('🏆 Все уровни пройдены! Поздравляем!', [
        { label: '🎮 Играть снова', cls: 'btn-next', action: fullReset }
      ]);
    } else {
      showMessage(`✨ Уровень ${currentLevel + 1} пройден!`, [
        { label: '▶ Следующий уровень', cls: 'btn-next', action: nextLevel },
        { label: '🔄 Повторить', cls: 'btn-restart', action: () => loadLevel(currentLevel) }
      ]);
    }
  }

  // Камера
  camera.x = player.x + player.w / 2 - canvas.width / 2;
  if (camera.x < 0) camera.x = 0;
  const maxCamX = worldWidth - canvas.width;
  if (maxCamX > 0 && camera.x > maxCamX) camera.x = maxCamX;
  if (maxCamX <= 0) camera.x = 0;
}

// ===== Рисование =====
function drawSky() {
  const theme = themes[currentLevel];
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, theme.sky1);
  grad.addColorStop(1, theme.sky2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Солнце/луна
  const isDark = currentLevel >= 8;
  ctx.fillStyle = isDark ? 'rgba(240, 240, 255, 0.3)' : 'rgba(255, 240, 100, 0.3)';
  ctx.beginPath();
  ctx.arc(canvas.width - 80, 80, 60, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = isDark ? 'rgba(240, 240, 255, 0.9)' : 'rgba(255, 240, 100, 0.9)';
  ctx.beginPath();
  ctx.arc(canvas.width - 80, 80, 40, 0, Math.PI * 2);
  ctx.fill();
}

function drawCloud(x, y, r) {
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.arc(x + r * 0.8, y + 5, r * 0.8, 0, Math.PI * 2);
  ctx.arc(x - r * 0.8, y + 5, r * 0.7, 0, Math.PI * 2);
  ctx.arc(x + r * 0.3, y - r * 0.5, r * 0.6, 0, Math.PI * 2);
  ctx.fill();
}

function drawClouds() {
  for (const c of clouds) {
    const px = c.x - camera.x * 0.3;
    if (px + c.r * 2 < 0 || px - c.r * 2 > canvas.width) continue;
    drawCloud(px, c.y + worldOffsetY * 0.5, c.r);
  }
}

function drawPlatform(p) {
  const theme = themes[currentLevel];
  ctx.fillStyle = theme.ground;
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.fillStyle = theme.grass;
  ctx.fillRect(p.x, p.y, p.w, 8);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fillRect(p.x, p.y, p.w, 3);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(p.x, p.y + p.h - 3, p.w, 3);
}

function drawCoin(coin, time) {
  if (coin.collected) return;
  const bob = Math.sin(time / 300 + coin.x) * 3;
  const y = coin.y + bob;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.beginPath();
  ctx.ellipse(coin.x, coin.y + 15, 10, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(coin.x, y, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#DAA520';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.beginPath();
  ctx.arc(coin.x - 4, y - 4, 3, 0, Math.PI * 2);
  ctx.fill();
}

function drawSpike(spike) {
  ctx.fillStyle = '#888';
  const numSpikes = Math.floor(spike.w / 10);
  for (let i = 0; i < numSpikes; i++) {
    const x = spike.x + i * 10;
    ctx.beginPath();
    ctx.moveTo(x, spike.y + spike.h);
    ctx.lineTo(x + 5, spike.y);
    ctx.lineTo(x + 10, spike.y + spike.h);
    ctx.closePath();
    ctx.fill();
  }
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawEnemy(e) {
  const cx = e.x + e.w / 2;
  const cy = e.y + e.h / 2;
  const r = e.w / 2;
  ctx.fillStyle = '#8B0000';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#5C0000';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(cx - 6, cy - 3, 5, 0, Math.PI * 2);
  ctx.arc(cx + 6, cy - 3, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'black';
  ctx.beginPath();
  ctx.arc(cx - 6 + e.dir * 2, cy - 3, 2.5, 0, Math.PI * 2);
  ctx.arc(cx + 6 + e.dir * 2, cy - 3, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'black';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 10, cy - 8);
  ctx.lineTo(cx - 3, cy - 6);
  ctx.moveTo(cx + 10, cy - 8);
  ctx.lineTo(cx + 3, cy - 6);
  ctx.stroke();
  ctx.fillStyle = 'white';
  ctx.fillRect(cx - 5, cy + 5, 3, 4);
  ctx.fillRect(cx + 2, cy + 5, 3, 4);
}

function drawFlag(time) {
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(flag.x, flag.y, 5, flag.h);
  const wave = Math.sin(time / 200) * 2;
  ctx.fillStyle = '#32CD32';
  ctx.beginPath();
  ctx.moveTo(flag.x + 5, flag.y);
  ctx.lineTo(flag.x + 40 + wave, flag.y + 15);
  ctx.lineTo(flag.x + 5, flag.y + 30);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#228B22';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(flag.x + 2.5, flag.y, 5, 0, Math.PI * 2);
  ctx.fill();
}

function drawPushkin() {
  const cx = player.x + player.w / 2;
  if (player.invincible > 0 && Math.floor(player.invincible * 10) % 2 === 0) {
    ctx.globalAlpha = 0.5;
  }
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.beginPath();
  ctx.ellipse(cx, player.y + player.h + 3, player.w * 0.4, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Фрак
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(player.x + 5, player.y + 25, player.w - 10, 30);
  // Рубашка
  ctx.fillStyle = 'white';
  ctx.fillRect(player.x + 15, player.y + 25, 15, 20);
  // Бабочка
  ctx.fillStyle = '#8B0000';
  ctx.beginPath();
  ctx.moveTo(cx - 3, player.y + 28);
  ctx.lineTo(cx - 8, player.y + 25);
  ctx.lineTo(cx - 8, player.y + 31);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + 3, player.y + 28);
  ctx.lineTo(cx + 8, player.y + 25);
  ctx.lineTo(cx + 8, player.y + 31);
  ctx.closePath();
  ctx.fill();

  // Голова
  ctx.fillStyle = '#FFD4A3';
  ctx.beginPath();
  ctx.arc(cx, player.y + 18, 15, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#D4A574';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Кудри
  ctx.fillStyle = '#2c1810';
  ctx.beginPath();
  ctx.arc(cx - 8, player.y + 10, 8, 0, Math.PI * 2);
  ctx.arc(cx, player.y + 6, 9, 0, Math.PI * 2);
  ctx.arc(cx + 8, player.y + 10, 8, 0, Math.PI * 2);
  ctx.arc(cx - 12, player.y + 15, 6, 0, Math.PI * 2);
  ctx.arc(cx + 12, player.y + 15, 6, 0, Math.PI * 2);
  ctx.fill();

  // Бакенбарды
  ctx.beginPath();
  ctx.ellipse(cx - 13, player.y + 20, 3, 6, 0, 0, Math.PI * 2);
  ctx.ellipse(cx + 13, player.y + 20, 3, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Глаза
  const eyeOffset = player.facing * 2;
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(cx - 5 + eyeOffset / 2, player.y + 18, 3, 0, Math.PI * 2);
  ctx.arc(cx + 5 + eyeOffset / 2, player.y + 18, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#2c1810';
  ctx.beginPath();
  ctx.arc(cx - 5 + eyeOffset, player.y + 18, 1.5, 0, Math.PI * 2);
  ctx.arc(cx + 5 + eyeOffset, player.y + 18, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Нос
  ctx.strokeStyle = '#D4A574';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx, player.y + 20);
  ctx.lineTo(cx + player.facing * 2, player.y + 23);
  ctx.stroke();

  // Улыбка
  ctx.strokeStyle = '#8B4513';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx, player.y + 24, 4, 0.1 * Math.PI, 0.9 * Math.PI);
  ctx.stroke();

  ctx.globalAlpha = 1;
}

function render(time) {
  worldOffsetY = Math.max(0, canvas.height - WORLD_HEIGHT);
  drawSky();
  drawClouds();
  ctx.save();
  ctx.translate(-camera.x, worldOffsetY);
  for (const p of platforms) drawPlatform(p);
  for (const p of movingPlatforms) drawPlatform(p);
  for (const spike of spikes) drawSpike(spike);
  for (const coin of coins) drawCoin(coin, time);
  for (const e of enemies) drawEnemy(e);
  drawFlag(time);
  drawPushkin();
  ctx.restore();
}

// ===== Главный цикл =====
function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  let dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  if (dt > 0.1) dt = 0.1;
  update(dt);
  render(timestamp);
  requestAnimationFrame(loop);
}

// ===== Управление =====
function setupButton(id, action) {
  const btn = document.getElementById(id);
  const start = (e) => { e.preventDefault(); action(true); btn.classList.add('pressed'); };
  const end = (e) => { e.preventDefault(); action(false); btn.classList.remove('pressed'); };
  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('touchend', end, { passive: false });
  btn.addEventListener('touchcancel', end, { passive: false });
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', end);
  btn.addEventListener('mouseleave', end);
}

setupButton('btn-left',  (v) => { input.left = v; });
setupButton('btn-right', (v) => { input.right = v; });
setupButton('btn-jump',  (v) => { if (v) jumpRequested = true; });

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    if (!e.repeat) jumpRequested = true;
  }
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
    e.preventDefault();
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
});

// Глобальный запрет скролла
document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', (e) => { e.preventDefault(); });

// ===== Адаптация canvas =====
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ===== Запуск =====
loadLevel(0);
requestAnimationFrame(loop);
</script>
